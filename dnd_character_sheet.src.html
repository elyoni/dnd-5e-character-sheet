function buildAIExport(){
  const character = buildCuratedCharacterForAI();
  const languageLine = lang === 'he' ? "\n\nPlease write your answer (the prose part of your reply) in Hebrew. Keep all YAML field names/keys in this format in English exactly as shown below — only the free-text values you write (like a feat's notes) and your conversational reply should be in Hebrew." : "";

  const trust = aiTrustLevel;
  let modSchema = `
level: 5
subclass: "Champion"`;
  let modRules = ` This block can ADD new entries (as above), and can also set "level" (a single integer, the character's new total level) and/or "subclass" (a string, only once the user has told you what it is) directly — include either only if it should change. Never set ability scores or HP directly: HP recalculates automatically from level, and an ability score change should be a feat addition (see "feats" above) with the matching "mod" instead of a separate field.`;
  if(trust === 'trusted' || trust === 'fullyTrusted'){
    modSchema += `
expertise:
  - "stealth"`;
    modRules += ` The user has also opted in to letting you set "expertise" directly: a list of skill keys (matching the character's own skillProficiencies keys, e.g. "stealth") to grant Expertise on (doubled proficiency bonus) — only skills the character is already proficient in.`;
  }
  if(trust === 'fullyTrusted'){
    modSchema += `
spellSlots:
  "1": 4
  "2": 3`;
    modRules += ` You may also include "spellSlots": a map from spell level (string key "1"–"9") to its new total slot count — include only levels whose total actually changes. Because spell slot progression depends on class/multiclass/Pact Magic rules you may not have exactly right, explicitly tell the user in your plain-text reply to double-check this against their own table before trusting it.`;
  }

  const instructions =
`This is a D&D 5e character from a character-sheet web app, exported for an AI assistant. Answer the user's question about it below.${languageLine}

Whenever 5e rules present the player with a choice (e.g. an Ability Score Improvement — which stat(s), or a feat instead; a subclass and its features; which spells to learn; which fighting style or maneuvers to take), do not decide on the player's behalf and do not invent a placeholder entry as a stand-in for the missing choice. Instead, list the concrete options in your reply and ask the user to pick, then wait for their answer before proposing any dnd-sheet-additions block for that item. Only add an entry once you actually know its real content.

Only include the dnd-sheet-additions block once something is actually settled and ready to add — after the user has answered your question, or when they explicitly ask you to output/apply a suggestion. Don't attach it speculatively to a reply that's still asking the player to choose between options, and don't re-send entries you already gave in an earlier reply unless the user asks you to.

If you want to suggest concrete additions to the sheet (a new feat, weapon/attack, spell, resource, or inventory item), also include ONE extra fenced code block labeled "dnd-sheet-additions" with YAML in exactly this shape (omit any category you're not suggesting, and omit the whole block if you have nothing to add):

\`\`\`dnd-sheet-additions
schemaVersion: ${AI_SCHEMA_VERSION}
feats:
  - name: "Example Feat"
    level: 1
    notes: "What it does."
    mod:
      stat: "dex"
      amount: 1
      perLevel: false
      fixed: false
attacks:
  - name: "Example Weapon"
    type: "melee"
    dmg: "1d8"
    dmgType: "slashing"
    prof: true
    notes: ""
spells:
  - name: "Example Spell"
    level: 1
    prepared: true
    range: "60 ft"
    castTime: "Action"
    save: "dex"
    dmg: "2d6"
    notes: ""
    category: "attack"
resources:
  - name: "Example Resource"
    total: 2
    recharge: "long"
    notes: ""
items:
  - name: "Example Item"
    qty: 1
    notes: ""
    category: "other"${modSchema}
\`\`\`

Rules for that block:${modRules} Always include "schemaVersion: ${AI_SCHEMA_VERSION}" exactly as shown, and don't invent fields beyond what's shown above.`;
  return instructions + "\n\n```yaml\nschemaVersion: " + AI_SCHEMA_VERSION + "\ncharacter:\n" + yamlDump(character, 1) + "```\n";
}
function stripStrayFenceLines(s){
  return s.split(/\r?\n/).filter(l => !/^\s*```/.test(l)).join('\n');
}
function extractAIAdditionsBlock(text){
  const labeled = /```dnd-sheet-additions\s*\n([\s\S]*?)```/.exec(text);
  if(labeled) return stripStrayFenceLines(labeled[1]);
  const re = /```[a-zA-Z0-9_-]*\s*\n([\s\S]*?)```/g;
  let m;
  while((m = re.exec(text))){ if(/schemaVersion\s*:/.test(m[1])) return stripStrayFenceLines(m[1]); }
  // Some AI chat UIs strip fence markers entirely when a reply is copied (e.g. a
  // per-code-block "copy" button, or copying the rendered view instead of raw
  // markdown) — fall back to locating the bare "schemaVersion:" line and reading
  // YAML-shaped lines until prose resumes.
  const lines = text.split(/\r?\n/);
  const startIdx = lines.findIndex(l => /^\s*schemaVersion\s*:/.test(l));
  if(startIdx === -1) return null;
  const collected = [];
  for(let i = startIdx; i < lines.length; i++){
    const line = lines[i];
    const trimmed = line.trim();
    if(trimmed === ''){ collected.push(line); continue; }
    if(trimmed.startsWith('```')) break;
    if(i > startIdx && indentOf(line) === 0 && !/^[A-Za-z_][\w.]*\s*:/.test(trimmed)) break;
    collected.push(line);
  }
  return collected.join('\n');
}

function parseAIPaste(){
  const t = T[lang];
  const ta = document.getElementById("aiPasteInput");
  const text = ta ? ta.value : "";
  aiParseError = ""; aiParsedAdditions = [];
  const block = extractAIAdditionsBlock(text);
  if(!block){ aiParseError = t.aiParseErrorNone; render(); return; }
  let parsed;
  try{ parsed = parseYAML(block); }catch(err){ parsed = null; }
  if(!parsed || typeof parsed !== 'object'){ aiParseError = t.aiParseErrorBad; render(); return; }
  if(parsed.schemaVersion !== AI_SCHEMA_VERSION){
    aiParseError = t.aiParseErrorVersion.replace('__CURRENT__', AI_SCHEMA_VERSION).replace('__GIVEN__', parsed.schemaVersion===undefined?'none':parsed.schemaVersion);
    render(); return;
  }
  const items = [];
  let sawAnyRawSuggestion = false;
  Object.keys(AI_ADDITION_SCHEMAS).forEach(cat => {
    const arr = parsed[cat];
    if(!Array.isArray(arr)) return;
    const existingList = cat === 'items' ? state.inventory.items : state[cat];
    const existingNames = new Set((existingList||[]).map(e => (e.name||"").trim().toLowerCase()).filter(Boolean));
    arr.forEach(data => {
      if(!data || typeof data !== 'object') return;
      sawAnyRawSuggestion = true;
      const name = (data.name||"").trim().toLowerCase();
      if(name && existingNames.has(name)) return;
      items.push({kind:'add', category:cat, data});
    });
  });
  if(typeof parsed.level === 'number' && parsed.level > 0 && parsed.level !== state.level){
    items.push({kind:'modify', category:'level', data:{from: state.level, to: parsed.level}});
  }
  if(typeof parsed.subclass === 'string' && parsed.subclass.trim() && parsed.subclass.trim() !== state.subclass){
    items.push({kind:'modify', category:'subclass', data:{from: state.subclass, to: parsed.subclass.trim()}});
  }
  if(aiTrustLevel === 'trusted' || aiTrustLevel === 'fullyTrusted'){
    if(Array.isArray(parsed.expertise)){
      parsed.expertise.forEach(skillKey => {
        if(SKILLS.some(s=>s[0]===skillKey) && state.skillProf[skillKey] && !state.skillExpertise[skillKey]){
          items.push({kind:'modify', category:'expertise', data:{skill: skillKey}});
        }
      });
    }
  }
  if(aiTrustLevel === 'fullyTrusted' && isPlainObject(parsed.spellSlots)){
    Object.entries(parsed.spellSlots).forEach(([lvlStr, total]) => {
      const idx = parseInt(lvlStr,10) - 1;
      if(idx>=0 && idx<9 && typeof total === 'number'){
        const current = (state.spellcasting.slots[idx] && state.spellcasting.slots[idx].total) || 0;
        if(total !== current) items.push({kind:'modify', category:'spellSlot', data:{spellLevel: idx+1, index: idx, from: current, to: total}});
      }
    });
  }
  if(items.length === 0){ aiParseError = sawAnyRawSuggestion ? t.aiParseErrorAllExist : t.aiParseErrorNone; render(); return; }
  aiParsedAdditions = items;
  render();
}
function applyAILevelChange(data){
  const oldEffMax = state.hpAutoCalc ? computeMaxHP(state) : null;
  state.level = data.to;
  if(typeof state.hitDice === 'string') state.hitDice = state.hitDice.replace(/^\s*\d+/, String(Math.max(1, data.to)));
  if(oldEffMax !== null){
    const newEffMax = computeMaxHP(state);
    state.hpMax = newEffMax;
    state.hpCur = Math.max(0, state.hpCur + (newEffMax - oldEffMax));
  }
}
function addAIItem(idx){
  const entry = aiParsedAdditions[idx];
  if(!entry) return;
  if(entry.kind === 'modify'){
    if(entry.category === 'level') applyAILevelChange(entry.data);
    else if(entry.category === 'subclass') state.subclass = entry.data.to;
    else if(entry.category === 'expertise') state.skillExpertise[entry.data.skill] = true;
    else if(entry.category === 'spellSlot') state.spellcasting.slots[entry.data.index].total = entry.data.to;
  } else {
    const merged = mergeAIDefaults(AI_ADDITION_SCHEMAS[entry.category].defaults, entry.data);
    if(entry.category === 'items'){
      if(!GEAR_CATEGORIES.includes(merged.category)) merged.category = 'other';
      state.inventory.items.push(merged);
      sortGearItems();
    } else {
      state[entry.category].push(merged);
    }
  }
  aiParsedAdditions.splice(idx,1);
  render(); queueSave();
}
function rejectAIItem(idx){ aiParsedAdditions.splice(idx,1); render(); }
function aiItemLabel(entry){
  const t = T[lang];
  const {category, data} = entry;
  if(entry.kind === 'modify'){
    if(category === 'level') return `<b>${t.aiCatLevel}</b> <span class="dim-label">${data.from} → ${data.to}</span>`;
    if(category === 'subclass') return `<b>${t.aiCatSubclass}</b> <span class="dim-label">${esc2(data.from)||"—"} → ${esc2(data.to)}</span>`;
    if(category === 'expertise'){
      const sk = SKILLS.find(s=>s[0]===data.skill);
      const skLabel = sk ? (lang==='he'?sk[3]:sk[2]) : data.skill;
      return `<b>${t.aiCatExpertise}</b> <span class="dim-label">${esc2(skLabel)}</span>`;
    }
    if(category === 'spellSlot') return `<b>${t.aiCatSpellSlot} ${data.spellLevel}</b> <span class="dim-label">${data.from} → ${data.to}</span>`;
  }
  const catLabel = {feats:t.aiCatFeat, attacks:t.aiCatAttack, spells:t.aiCatSpell, resources:t.aiCatResource, items:t.aiCatItem}[category];
  const parts = [`<b>${esc2(data.name||"")}</b>`, `<span class="dim-label">${catLabel}</span>`];
  if(category==='feats' && data.level) parts.push(`Lv.${data.level}`);
  if(category==='attacks') parts.push(esc2([data.dmg,data.dmgType].filter(Boolean).join(" ")));
  if(category==='spells' && data.level!==undefined) parts.push(`Lv.${data.level}`);
  if(category==='resources' && data.total) parts.push(`×${data.total}`);
  if(category==='items' && data.qty) parts.push(`×${data.qty}`);
  return parts.join(" · ");
}

function confirmPrint(){
  printModalOpen = false;
  const html = buildPrintHTML(printOpts);
  const w = window.open("", "_blank");
  if(!w){
    alert(lang==='he' ? "הדפדפן חסם חלון קופץ. אשר חלונות קופצים לאתר הזה ונסה שוב." : "Your browser blocked the pop-up window. Please allow pop-ups for this site and try again.");
    render();
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 300);
  render();
}

function slotDotsStatic(sl){
  if(sl.total<=0) return `<span class="pdim">—</span>`;
  let out = "";
  for(let i=0;i<sl.total;i++) out += `<span class="pdot ${i<sl.used?'filled':''}"></span>`;
  return out;
}
function resourceDotsStatic(r){
  if(r.total<=0) return `<span class="pdim">—</span>`;
  let out = "";
  for(let i=0;i<r.total;i++) out += `<span class="pdot ${i<r.used?'filled':''}"></span>`;
  return out;
}

function buildPrintHTML(opts){
  opts = opts || {};

  const extraAttacks = Math.max(0, parseInt(opts.extraAttacks)||0);
  const extraSpells = Math.max(0, parseInt(opts.extraSpells)||0);
  const t = T[lang];

    .map(([k,icon])=>{ const v = getEffectiveSecondarySpeed(state,k); return v>0 ? `${icon} ${t[SECONDARY_SPEED_LABEL_KEY[k]]}: ${v} ft` : null; })
    .filter(Boolean).join(" · ");

    const val = mod(effAbil[a]) + (p?prof:0);

  }).join("");

  const blankAttackRow = `<tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>`;
  const attackRows = state.attacks.map(a=>{

    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .two-col-13{display:grid;grid-template-columns:1fr 2fr;gap:10px;}
    @media(max-width:640px){.two-col-13{grid-template-columns:1fr;}}
    .list-row{display:grid;grid-template-columns:18px 1fr 36px;gap:5px;padding:2.5px 2px;border-bottom:1px solid #e6dcc0;font-size:12.5px;align-items:center;}
    [dir="rtl"] .list-row{grid-template-columns:36px 1fr 18px;}
    .list-row.skill-row{grid-template-columns:18px 18px 1fr 36px;}
    [dir="rtl"] .list-row.skill-row{grid-template-columns:36px 36px 1fr 18px;}
    .list-row .mark{color:var(--gold-bright);text-align:center;}
    .list-row .val{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:center;color:var(--gold);}
    .ability-tag{font-size:9.5px;color:var(--ink-faint);}
    .skills-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(9,auto);column-gap:16px;}
    .table-scroll{width:100%;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;}
    th{text-align:${dir==='rtl'?'right':'left'};font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line);padding:3px 5px;}
    td{border-bottom:1px solid #e6dcc0;padding:3px 5px;}
    td.num{text-align:center;font-variant-numeric:tabular-nums;}
    .slots-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:7px 0;}
    @media(max-width:480px){.slots-grid{grid-template-columns:repeat(3,1fr);}}
    .slot-box{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;text-align:center;padding:4px 3px;}
    .slot-box .lv{font-size:8.5px;color:var(--gold);letter-spacing:1px;}
    .dots-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px;}
    .pdot,.dot{width:10px;height:10px;border-radius:50%;border:1.2px solid var(--gold);display:inline-block;}
    .pdot.filled,.dot.filled{background:var(--gold);}
    .pdim{color:var(--ink-faint);font-size:10.5px;}
    ol.flow-list{list-style:none;counter-reset:flow;margin:0;padding:0;}
    ol.flow-list > li{counter-increment:flow;position:relative;padding:5px 0 5px 30px;border-bottom:1px solid #e6dcc0;font-size:12.5px;line-height:1.45;}
    [dir="rtl"] ol.flow-list > li{padding:5px 30px 5px 0;}
    ol.flow-list > li:last-child{border-bottom:none;}
    ol.flow-list > li::before{content:counter(flow);position:absolute;left:0;top:5px;width:19px;height:19px;border-radius:50%;border:1.2px solid var(--gold);color:var(--gold);font-family:'Cinzel',serif;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;}
    .option-list{list-style:none;margin:5px 0 0;padding:0;}
    .option-list li{position:relative;padding:2px 0 2px 14px;font-size:11.5px;color:var(--ink-dim);line-height:1.35;border-bottom:none;}
    .option-list li::before{content:"–";position:absolute;left:0;color:var(--gold);}
    [dir="rtl"] ol.flow-list > li::before{left:auto;right:0;}
    .f{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold-bright);}
    dl{margin:0;font-size:12.5px;line-height:1.45;}
    dt{font-weight:700;margin-top:6px;color:var(--ink);}
    dd{margin:0 0 3px;color:var(--ink-dim);}
    .notes-box{white-space:pre-wrap;font-size:12.5px;min-height:30px;}
    @media print{ body{margin:0;padding:10px;} .panel{break-inside:avoid;} }
    @page{ margin:11mm; }
  </style></head><body>
    <h1>${esc(state.name)}</h1>
    <div class="sub">${t.title}</div>
    <div class="identity-row"><span><b>${t.cls}:</b> ${esc(state.cls)}${state.subclass?` (${esc(state.subclass)})`:""}</span><span><b>${t.level}:</b> ${state.level}</span><span><b>${t.race}:</b> ${esc(state.race)}${state.subrace?` (${esc(state.subrace)})`:""}</span><span><b>${t.bg}:</b> ${esc(state.bg)}</span><span><b>${t.size}:</b> ${t["size"+state.size]||esc(state.size)}</span></div>

    <div class="panel"><h2>📊 ${t.abilities} 💪🏹🛡️🧠👁️✨</h2><div class="abilities">${abilBoxes}</div></div>

    <div class="panel"><h2>🛡️⚔️ ${t.combat}</h2>
      <div class="combat-strip">
        <div class="combat-box ac-box"><span class="label">🛡️ ${t.ac}</span>
          <div class="shape-wrap"><svg class="shape-bg" viewBox="0 0 100 112" preserveAspectRatio="none"><path d="M50 3 L94 16 L94 54 Q94 90 50 109 Q6 90 6 54 L6 16 Z"/></svg><div class="shape-content"><span class="big">${computeAC(state)}</span></div></div>
        </div>
        <div class="combat-box"><span class="label">${t.init}</span><span class="big roll-trigger no-print" onclick="rollInitiative()" title="${t.atkRoll}">${initRollFlash ? `<b class="roll-flash">${fm(initRollFlash.total)}</b>` : fm(effInit)}</span></div>
        <div class="combat-box"><span class="label">🐇 ${t.speed}</span><span class="big">${effSpeed} <span style="font-size:11px">(${Math.floor(effSpeed/5)} sq)</span></span>${secondarySpeedParts ? `<div class="formula-note">${secondarySpeedParts}</div>` : ""}</div>
        <div class="combat-box"><span class="label">${t.hitdice}</span><span class="big" style="font-size:15px">${esc(computeHitDice(state))}</span></div>
        <div class="combat-box"><span class="label">${t.prof}</span><span class="big">${fm(prof)}</span></div>
        <div class="combat-box hp-box"><svg class="hp-heart-bg" viewBox="0 0 100 100"><path d="M50 90 C18 66 2 46 2 25 C2 8 15 2 27 2 C38 2 46 8 50 19 C54 8 62 2 73 2 C85 2 98 8 98 25 C98 46 82 66 50 90 Z"/></svg><span class="label">❤️ ${t.hp}${state.hpAutoCalc?" (auto)":""}</span><span class="big">${state.hpCur} / ${state.hpMax + getFeatBonus(state,"hp")}</span></div>
      </div>
      <div class="conc-row">
        <span><b>${t.acBreakdown}:</b> ${acFormulaNote(state, t)}</span>
      </div>
    </div>

    <div class="two-col-13">
      <div class="panel"><h2>${t.saves}</h2>
        <div class="pdim" style="margin-bottom:6px;line-height:1.4">${lang==='en' ? 'd20 + ability mod + prof (● only)' : 'd20 + מודיפייר תכונה + מיומנות (● בלבד)'}</div>
        ${(()=>{ const cnt = ABILS.filter(a=>state.saveProf[a]).length;
          if(cnt!==2) return `<div class="pdim" style="color:var(--blood);margin-bottom:6px">${lang==='en'?`⚠ ${cnt} save(s) marked — most classes grant exactly two.`:`⚠ מסומנות ${cnt} הצלות — רוב המחלקות נותנות בדיוק שתיים.`}</div>`;
          return "";
        })()}
        ${saveRows}
      </div>
      <div class="panel"><h2>${t.skills}</h2>
        <div class="pdim" style="margin-bottom:6px;line-height:1.4">${lang==='en' ? 'd20 + ability mod (in parens) + prof (● only)' : 'd20 + מודיפייר תכונה (בסוגריים) + מיומנות (● בלבד)'}</div>
        <div class="skills-grid">${skillRows}</div>
        <div class="conc-row" style="margin-top:8px;padding-top:8px">
          <span><b>${t.passivePerception}:</b> ${computePassivePerception(state)} <span class="pdim">(10 + WIS ${fm(mod(effAbil.wis))}${state.skillProf.perception?` + prof ${fm(prof*(state.skillExpertise.perception?2:1))}`:""})</span></span>
        </div>
      </div>
    </div>

    <div class="panel"><h2>${t.proficiencies}</h2>
      <div class="two-col" style="font-size:13px">
        <div><b>${t.profArmor}:</b> ${esc(armorProfSummary(state, lang))||"—"}<br><b>${t.profWeapons}:</b> ${esc(weaponProfSummary(state, lang))||"—"}</div>
        <div><b>${t.profTools}:</b> ${esc(state.proficiencies.tools)||"—"}<br><b>${t.profLanguages}:</b> ${esc(languageProfSummary(state, lang))||"—"}</div>
      </div>
    </div>

    <div class="panel"><h2>${t.inventory}</h2>
      <div style="font-size:13px;margin-bottom:8px"><b>${t.currency}:</b> ${["cp","sp","ep","gp","pp"].map(c=>`${state.inventory.currency[c]} ${c.toUpperCase()}`).join(" · ")}</div>
      ${(() => {
        const gearItems = state.inventory.items.filter(it=>it.type==="gear");
        const armorItems = state.inventory.items.filter(it=>it.type==="armor"||it.type==="shield");
        const gearHTML = gearItems.length ? `<h3 style="font-size:12px;color:var(--gold);margin:8px 0 4px">${t.gearTable}</h3><div class="table-scroll"><table><thead><tr><th>${t.itemCategory}</th><th>${t.itemName}</th><th>${t.itemQty}</th><th>${t.itemNotes}</th></tr></thead><tbody>${gearItems.map(it=>{
          const catLabel = t["gearCat"+(it.category||"other").charAt(0).toUpperCase()+(it.category||"other").slice(1)];
          return `<tr><td>${esc(catLabel)}</td><td>${esc(it.name)}</td><td class="num">${it.qty}</td><td>${esc(it.notes)}</td></tr>`;
        }).join("")}</tbody></table></div>` : "";
        const armorHTML = armorItems.length ? `<h3 style="font-size:12px;color:var(--gold);margin:8px 0 4px">${t.armorTable}</h3><div class="table-scroll"><table><thead><tr><th>${t.itemType}</th><th>${t.itemName}</th><th>${t.itemQty}</th><th>${t.itemEquippedAbbr}</th><th>${t.itemAC}</th><th>${t.itemNotes}</th></tr></thead><tbody>${armorItems.map(it=>{
          const typeLabel = it.type==="shield" ? t.itemTypeShield : t.itemTypeArmor;
          const acCell = it.type==="armor" ? `${it.acBase}${it.acAbility!=='none'?` +${t[it.acAbility]}`:''}` : `+${it.shieldBonus}`;
          return `<tr><td>${esc(typeLabel)}</td><td>${esc(it.name)}</td><td class="num">${it.qty}</td><td>${it.equipped ? "✓" : ""}</td><td>${acCell}</td><td>${esc(it.notes)}</td></tr>`;
        }).join("")}</tbody></table></div>` : "";
        return gearHTML + armorHTML;
      })()}
    </div>

    <div class="panel"><h2>${t.attacks}</h2>
      <div class="table-scroll"><table><thead><tr><th>${t.atkName}</th><th>${t.atkType}</th><th>${t.atkProf}</th><th>${t.atkBonus}</th><th>${t.atkDmg}</th><th>${t.atkDmgType}</th><th>${t.atkNotes}</th></tr></thead>
      <tbody>${attackRows}</tbody></table></div>
    </div>

    <div class="panel"><h2>${t.spells}</h2>
      <div class="combat-strip" style="margin-bottom:6px">
        <div class="combat-box"><span class="label">${t.spCastAbil}</span><span class="big" style="font-size:15px">${t[state.spellcasting.abil]}</span></div>
        <div class="combat-box"><span class="label">${t.spellSaveDC}</span><span class="big">${spellSaveDC}</span></div>
        <div class="combat-box"><span class="label">${t.spellAtk}</span><span class="big">${spellAtk}</span></div>
      </div>
      ${slotRows ? `<div class="slots-grid">${slotRows}</div>` : ""}
      ${(state.spells.length || extraSpells) ? `<div class="pdim" style="margin-bottom:6px">${t.spLegend}</div><div class="table-scroll"><table><thead><tr><th>${t.spLevel}</th><th>${t.spPrepared}</th><th>${t.spName}</th><th>${t.spCategory}</th><th>${t.spRange}</th><th>${t.spCastTime}</th><th>${t.spSave}</th><th>${t.spVerbal}</th><th>${t.spSomatic}</th><th>${t.spMaterial}</th><th>${t.spDmg}</th><th>${t.spNotes}</th></tr></thead><tbody>${spellRows}</tbody></table></div>` : ""}
    </div>

    ${state.feats.length ? `<div class="panel"><h2>${t.feats}</h2><div class="table-scroll"><table><thead><tr><th>${t.featLvlAbbr}</th><th>${t.featName}</th><th>${t.featNotes}</th></tr></thead><tbody>${featRows}</tbody></table></div></div>` : ""}

    ${state.resources.length ? `<div class="panel"><h2>${t.resources}</h2><div class="table-scroll"><table><thead><tr><th>${t.resName}</th><th>${t.resUses}</th><th></th><th>${t.resRecharge}</th><th>${t.resNotes}</th></tr></thead><tbody>${resourceRows}</tbody></table></div></div>` : ""}

    <div class="panel"><h2>${t.notes}</h2><div class="notes-box">${esc(state.notes)}</div></div>

    ${minimal ? "" : `
    <div class="panel"><h2>${t.turnFlowTitle}</h2><ol class="flow-list">${turnStepsFilled.map((s,i)=>`<li>${s}${(t.turnStepDetails[i]||[]).length?`<ul class="option-list">${t.turnStepDetails[i].map(d=>`<li>${d}</li>`).join("")}</ul>`:""}</li>`).join("")}</ol></div>

    <div class="panel"><h2>${t.atkFlowTitle}</h2>
      <div class="conc-row" style="margin-top:0;padding-top:0;border-top:none;margin-bottom:10px">
        <span><b>${t.concLabel}</b> ${state.concentration.active ? esc(state.concentration.spell||"?") : "—"}</span>
        <span><b>${t.concDCPrefix}</b> ${Math.max(10, Math.floor((state.concentration.dmg||0)/2))} <span class="pdim">(${t.concSavePrefix} ${fm(conMod + (state.saveProf.con?prof:0))} ${t.concSaveSuffix})</span></span>
      </div>
      <ol class="flow-list">${atkStepsFilled.map(s=>`<li>${s}</li>`).join("")}</ol>
    </div>

    <div class="panel"><h2>${t.ref}</h2>${t.refBody}</div>
    `}
  </body></html>`;
}

function applySpellPreset(idx){
  if(idx === "" || idx === null || idx === undefined) return;
  const list = SPELL_PRESETS[state.cls] || [];
  const p = list[+idx];
  if(!p) return;
  const levelEl = document.getElementById("modalSpellLevel");
  const nameEl = document.getElementById("modalSpellName");
  const dmgEl = document.getElementById("modalSpellDmg");
  const notesEl = document.getElementById("modalSpellNotes");
  const categoryEl = document.getElementById("modalSpellCategory");
  if(levelEl) levelEl.value = p.level;
  if(nameEl) nameEl.value = p.name;
  if(dmgEl) dmgEl.value = p.dmg;
  if(notesEl) notesEl.value = lang === "he" ? p.notesHe : p.notesEn;
  if(categoryEl){ categoryEl.value = p.category || ""; categoryEl.dispatchEvent(new Event("change")); }
}

const SECONDARY_SPEED_LABEL_KEY = {climb:"climbSpeed", swim:"swimSpeed", fly:"flySpeed"};
function secondarySpeedRowHTML(t, kind, icon){
  const field = SECONDARY_SPEED_FIELD[kind];
  const manualBase = kind === "swim"; // climb/fly are feat-only: no manual base field, hidden until a feat grants them
  const overrideFeat = getSecondarySpeedOverrideFeat(state, kind);
  const val = getEffectiveSecondarySpeed(state, kind);
  if(val === 0) return "";
  const base = state[field];
  const featBonus = getSecondarySpeedBonus(state, kind);
  const featWord = lang==='en'?'feat':'תכונה';
  const label = t[SECONDARY_SPEED_LABEL_KEY[kind]];
  let noteText;
  if(overrideFeat && overrideFeat.mod.matchSpeed){
    noteText = `= ${t.speed}${featBonus!==0 ? ` ${fm(featBonus)} ${featWord}` : ` (${featWord})`}`;
  } else if(overrideFeat && overrideFeat.mod.fixed){
    const lvl = Math.max(1, parseInt(state.level)||1);
    const amt = parseInt(overrideFeat.mod.amount)||0;
    const fixedVal = overrideFeat.mod.perLevel ? amt*lvl : amt;
    noteText = `${fixedVal} (${featWord})${featBonus!==0 ? ` ${fm(featBonus)} ${featWord}` : ""}`;
  } else if(manualBase){
    noteText = `${base}${featBonus!==0 ? ` ${fm(featBonus)} ${featWord}` : ""}`;
  } else {
    noteText = `${fm(featBonus)} ${featWord}`;
  }
  return `<div class="speed-value-group" style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--leather-line)">
    <span class="dim-label" title="${label}">${icon}</span>
    <span class="mono" style="font-weight:700">${val}</span>
    ${manualBase && !overrideFeat ? `<span class="dim-label">${t.speedBase}</span><input type="number" min="0" style="width:34px;text-align:center;padding:0" value="${base}" onchange="set('${field}', parseInt(this.value)||0)">` : ""}
  </div>
  <div class="formula-note">${noteText}</div>`;
}
function featModLabelForRow(t, stat){
  if(stat==='speed') return t.speed;
  if(stat==='climb') return t.climbSpeed;
  if(stat==='swim') return t.swimSpeed;
  if(stat==='fly') return t.flySpeed;
  if(stat==='hp') return t.featHP;
  if(stat==='critRange') return t.featCritRange;
  if(stat==='atk_all') return t.featAtkAll;
  if(stat==='atk_melee') return t.featAtkMelee;
  if(stat==='atk_ranged') return t.featAtkRanged;
  if(stat==='atk_finesse') return t.featAtkFinesse;
  if(stat==='atk_spell') return t.featAtkSpell;
  if(stat==='dmg_all') return t.featDmgAll;
  if(stat==='dmg_melee') return t.featDmgMelee;
  if(stat==='dmg_ranged') return t.featDmgRanged;
  if(stat==='dmg_finesse') return t.featDmgFinesse;
  if(stat==='dmg_spell') return t.featDmgSpell;
  return t[stat] || stat;
}
function estimateTextRows(text){
  const lines = String(text||"").split("\n");
  let rows = 0;
  lines.forEach(l => { rows += Math.max(1, Math.ceil(l.length/48)); });
  return Math.max(1, Math.min(14, rows));
}
function featRow(f, i){
  const t = T[lang];
  const modStat = (f.mod && f.mod.stat) || "";
  const modAmt = (f.mod && f.mod.amount) || 0;
  const perLevel = !!(f.mod && f.mod.perLevel);
  const matchSpeed = !!(f.mod && f.mod.matchSpeed);
  const fixed = !!(f.mod && f.mod.fixed);
  const amtText = `${fm(modAmt)}${perLevel ? ` <span class="feat-lvmark">× Lv${state.level} = ${fm(modAmt*Math.max(1,state.level))}</span>` : ""}`;
  const badge = modStat ? `<span class="feat-badge">${featModLabelForRow(t,modStat)} ${
    modStat === 'critRange' ? `${20 - Math.abs(modAmt)}–20`
    : matchSpeed ? `= ${t.speed}` : fixed ? `= ${amtText}` : amtText
  }</span>` : "";
  return `<div class="feat-card">
    <div class="feat-card-top">
      <span class="feat-name-display">${t.featLvlAbbr}${lang==='he'?' ':''}${f.level||1}</span>
      <span class="feat-name-display">|</span>
      <span class="feat-name-display">${esc2(f.name)}</span>
      ${badge}
      <button class="edit-row no-print" onclick="openEditFeatModal(${i})" title="${t.edit}">✏️</button>
      <button class="remove-row no-print" onclick="confirmRemove(()=>removeFeat(${i}))" title="${t.del}">🗑️</button>
    </div>
    <div class="feat-notes-input feat-notes-display${f.notes ? "" : " dim"}">${f.notes ? esc2(f.notes) : t.featNotes}</div>
  </div>`;
}
function esc2(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let featModalOpen = false;

function confirmFeatModal(){
  const nameEl = document.getElementById("modalFeatName");
  const name = nameEl.value.trim();
  if(!name) return;
  const level = Math.max(1, Math.min(20, parseInt(document.getElementById("modalFeatLevel").value)||1));
  const stat = document.getElementById("modalFeatAffects").value;
  const amount = parseInt(document.getElementById("modalFeatAmount").value)||0;
  const perLevel = document.getElementById("modalFeatPerLevel").checked;
  const isSpd = stat==='climb'||stat==='swim'||stat==='fly';
  const matchSpeed = isSpd && document.getElementById("modalFeatMatchSpeed").checked;
  const fixed = isSpd && !matchSpeed && document.getElementById("modalFeatFixed").checked;
  const notes = document.getElementById("modalFeatNotes").value;
  const feat = {name, level, notes, mod:{stat, amount: (stat && !matchSpeed) ? amount : 0, perLevel: stat && !matchSpeed ? perLevel:false, matchSpeed, fixed}};
  if(editingFeatIndex===null) state.feats.push(feat);
  else state.feats[editingFeatIndex] = feat;
  featModalOpen = false;
  editingFeatIndex = null;
  render();
  queueSave();
}

function resourceDots(i){
  const t = T[lang];
  const r = state.resources[i];
  if(r.total<=0) return `<span class="dim" style="font-size:11px;color:var(--ink-faint)">—</span>`;
  let out = "";
  for(let d=0; d<r.total; d++){
    const filled = d < r.used;
    out += `<span class="dot ${filled?'filled':''}" onclick="toggleResourceDot(${i},${d})" title="${t.resUses}"></span>`;
  }
  return out;
}
function toggleResourceDot(ri, di){
  const r = state.resources[ri];
  r.used = (di+1 === r.used) ? di : di+1;
  r.used = Math.max(0, Math.min(r.total, r.used));
  render(); queueSave();
}

function sortGearItems(){

/* Quick-start templates: add a class's signature resources/attacks without
   touching anything the person has already filled in (skips duplicates by name). */
const CLASS_SAVES = {
  Barbarian:["str","con"], Bard:["dex","cha"], Cleric:["wis","cha"], Druid:["int","wis"],
  Fighter:["str","con"], Monk:["str","dex"], Paladin:["wis","cha"], Ranger:["str","dex"],
  Rogue:["dex","int"], Sorcerer:["con","cha"], Warlock:["wis","cha"], Wizard:["int","wis"], Artificer:["con","int"]
};
const CLASS_SKILL_SUGGEST = {
  Barbarian:["athletics","perception"], Bard:["performance","persuasion"], Cleric:["religion","insight"],
  Druid:["nature","survival"], Fighter:["athletics","perception"], Monk:["acrobatics","stealth"],
  Paladin:["religion","persuasion"], Ranger:["survival","stealth"], Rogue:["stealth","sleight"],
  Sorcerer:["arcana","persuasion"], Warlock:["arcana","deception"], Wizard:["arcana","investigation"], Artificer:["investigation","arcana"]
};
function applyTemplate(cls){
  const hasRes = name => state.resources.some(r => r.name.toLowerCase()===name.toLowerCase());
  const addRes = (name, total, recharge) => { if(!hasRes(name)) state.resources.push({name, total, used:0, recharge, notes:""}); };
  const attacksAreDefault = state.attacks.length===1 && state.attacks[0].name==="Shortsword";

  (CLASS_SAVES[cls]||[]).forEach(a => state.saveProf[a] = true);
  (CLASS_SKILL_SUGGEST[cls]||[]).forEach(sk => state.skillProf[sk] = true);

  state.hasSpells = CASTER_CLASSES.includes(cls);
  if(CLASS_HIT_DIE[cls]){
    const m = /^\s*(\d+)/.exec(state.hitDice || "");
    const count = m ? Math.max(1, parseInt(m[1])) : Math.max(1, state.level);
    state.hitDice = `${count}d${CLASS_HIT_DIE[cls]}`;
  }

  if(cls==="Fighter"){
    addRes("Second Wind", 1, "short");
    addRes("Action Surge", 1, "short");
  } else if(cls==="Cleric"){
    addRes("Channel Divinity", 1, "short");
    state.spellcasting.abil = "wis";
  } else if(cls==="Monk"){
    addRes("Ki Points", Math.max(1, state.level), "short");
    if(attacksAreDefault) state.attacks = [{name:"Unarmed Strike", type:"finesse", dmg:"1d4", spellAbil:"cha", notes:"Martial Arts"}];
  } else if(cls==="Barbarian"){
    addRes("Rage", 2, "long");
  } else if(cls==="Bard"){
    addRes("Bardic Inspiration", 1, "long");
    state.spellcasting.abil = "cha";
  } else if(cls==="Druid"){
    addRes("Wild Shape", 2, "short");
    state.spellcasting.abil = "wis";
  } else if(cls==="Sorcerer"){
    addRes("Sorcery Points", Math.max(1, state.level), "long");
    state.spellcasting.abil = "cha";
  } else if(cls==="Warlock"){
    state.spellcasting.abil = "cha";
  } else if(cls==="Wizard"){
    state.spellcasting.abil = "int";
  } else if(cls==="Paladin"){
    state.spellcasting.abil = "cha";
  } else if(cls==="Ranger"){
    state.spellcasting.abil = "wis";
  }
  render(); queueSave();
}
function selectClass(value){
  state.cls = value;
  applyTemplate(value);
}

function setSlot(i, field, value){
  state.spellcasting.slots[i][field] = Math.max(0, parseInt(value)||0);
  if(state.spellcasting.slots[i].used > state.spellcasting.slots[i].total) state.spellcasting.slots[i].used = state.spellcasting.slots[i].total;
  render(); queueSave();
}
function toggleSlotDot(li, di){
  const sl = state.spellcasting.slots[li];
  sl.used = (di+1 === sl.used) ? di : di+1;
  sl.used = Math.max(0, Math.min(sl.total, sl.used));
  render(); queueSave();
}
function slotDotsInteractive(i){
  const t = T[lang];
  const sl = state.spellcasting.slots[i];
  if(sl.total<=0) return `<span class="dim" style="font-size:11px;color:var(--ink-faint)">—</span>`;
  let out = "";
  for(let d=0; d<sl.total; d++){
    const filled = d < sl.used;
    out += `<span class="dot ${filled?'filled':''}" onclick="toggleSlotDot(${i},${d})" title="${t.slotUsed}"></span>`;
  }
  return out;
}
function toggleHitDieDot(d){
  state.hitDiceUsed = (d+1 === state.hitDiceUsed) ? d : d+1;
  state.hitDiceUsed = Math.max(0, Math.min(Math.max(1,state.level), state.hitDiceUsed));

}

          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div style="font-size:13px">${aiItemLabel(entry)}</div>
            <div style="display:flex;gap:6px;flex:none">
              <button class="btn primary" style="padding:4px 10px;font-size:12px" onclick="addAIItem(${i})">${t.aiAddBtn}</button>
              <button class="btn" style="padding:4px 10px;font-size:12px" onclick="rejectAIItem(${i})">${t.aiRejectBtn}</button>
            </div>
          </div>
          ${entry.kind==='modify' && entry.category==='spellSlot' ? `<div style="font-size:11px;color:var(--danger,#c0392b);margin-top:4px">${t.aiSpellSlotWarning}</div>` : ""}
        </div>`).join("")}
      </div>` : ""}

      <div class="modal-actions">
        <button class="btn" onclick="closeAIModal()">${t.closeBtn}</button>
      </div>
    </div>
  </div>` : ""}

  ${printModalOpen ? `
  <div class="modal-backdrop no-print" onclick="if(event.target===this) cancelPrint()">
    <div class="modal-box">
      <h3>${t.printSettingsTitle}</h3>
      <div class="modal-row">
        <label>${t.printStyleLabel}</label>
        <label class="radio-opt"><input type="radio" name="printStyle" ${!printOpts.minimal?"checked":""} onchange="setPrintOpt('minimal', false)"> ${t.printStandard}</label>
        <label class="radio-opt"><input type="radio" name="printStyle" ${printOpts.minimal?"checked":""} onchange="setPrintOpt('minimal', true)"> ${t.printMinimal}</label>
      </div>
      <div class="modal-row">
        <label>${t.extraAttackRows}</label>
        <input type="number" min="0" max="20" value="${printOpts.extraAttacks}" onchange="setPrintOpt('extraAttacks', parseInt(this.value)||0)">
      </div>
      <div class="modal-row">
        <label>${t.extraSpellRows}</label>
        <input type="number" min="0" max="20" value="${printOpts.extraSpells}" onchange="setPrintOpt('extraSpells', parseInt(this.value)||0)">
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="cancelPrint()">${t.printCancel}</button>
        <button class="btn primary" onclick="confirmPrint()">${t.printGo}</button>
      </div>
    </div>
  </div>` : ""}
  ${whatsNewModalOpen ? whatsNewModalHTML(t) : ""}
  `;
  document.documentElement.dir = lang==='he' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute("data-theme", theme);
  trimDiceHistories();
  restoreScroll();
}
function trimDiceHistories(){
  document.querySelectorAll('.dice-history.compact').forEach(el=>{
    const spans = [...el.children];
    if(!spans.length) return;
    spans.forEach(s=>{ s.style.display = ''; });
    const maxWidth = el.clientWidth;
    const gap = parseFloat(getComputedStyle(el).gap) || 0;
    let used = 0;
    spans.forEach((s,idx)=>{
      used += s.offsetWidth + (idx>0 ? gap : 0);
      if(used > maxWidth) s.style.display = 'none';
    });
  });
}
window.addEventListener('resize', trimDiceHistories);

(async function init(){
  document.getElementById("app").innerHTML = `<div style="padding:40px;text-align:center;color:#b8a97e">Loading…</div>`;
  try{
    try{
      const langRes = await storageGet("dnd-lang");
      if(langRes && (langRes.value==='en' || langRes.value==='he')) lang = langRes.value;
    }catch(e){}
    try{
      const themeRes = await storageGet("dnd-theme");
      if(themeRes && THEME_LIST.includes(themeRes.value)) theme = themeRes.value;
    }catch(e){}
    try{
      const trustRes = await storageGet("dnd-ai-trust");
      if(trustRes && ["guided","trusted","fullyTrusted"].includes(trustRes.value)) aiTrustLevel = trustRes.value;
    }catch(e){}
    try{
      const foldRes = await storageGet("dnd-folded-panels");
      if(foldRes && foldRes.value){
        const parsed = JSON.parse(foldRes.value);
        if(parsed && typeof parsed === "object"){
          if(parsed.panels && typeof parsed.panels === "object") foldedPanels = parsed.panels;
          if(typeof parsed.dice === "boolean") diceFolded = parsed.dice;
          if(typeof parsed.ref === "boolean") refOpen = parsed.ref;
          if(parsed.locks && typeof parsed.locks === "object") panelLocks = parsed.locks;
        }
      } else {
        // Brand-new install (no fold/lock state saved yet at all) — lock
        // Saving Throws and Skills by default so a stray tap doesn't
        // silently flip a proficiency checkbox. Existing installs keep
        // whatever lock state they already have; this only applies once,
        // the first time there's nothing saved under this key at all.
        panelLocks = {saves:true, skills:true};
      }
    }catch(e){}
    await loadIndex();
    const importedFromURL = await checkURLImport();
    if(importedFromURL){
      try{ await storageSet("dnd-onboarded", "1"); }catch(e){}
    } else {
      const onboardedRes = await storageGet("dnd-onboarded");
      const alreadyOnboarded = !!onboardedRes;
      if(charIndex.length===0){
        // No character to load — the "no characters" screen lets them create one
        // (blank or demo) themselves; nothing is created on their behalf.
        state = null;
        if(!alreadyOnboarded){
          onboardingModalOpen = true;
        }
        // Fresh installs get onboarding, not the "what's new" popup — mark it
        // seen now so it never surfaces once they create their first character.
        try{ await storageSet("dnd-whatsnew-seen", WHATS_NEW_VERSION); }catch(e){}
      } else {
        if(!alreadyOnboarded){ try{ await storageSet("dnd-onboarded", "1"); }catch(e){} }
        const lastId = await getLastUsedId();
        const targetId = (lastId && charIndex.some(c=>c.id===lastId)) ? lastId : charIndex[0].id;
        await loadChar(targetId);
        try{
          const seenRes = await storageGet("dnd-whatsnew-seen");
          if(alreadyOnboarded && (!seenRes || seenRes.value !== WHATS_NEW_VERSION)){
            whatsNewModalOpen = true;
          } else if(!seenRes){
            await storageSet("dnd-whatsnew-seen", WHATS_NEW_VERSION);
          }
        }catch(e){}
      }
    }
  }catch(e){
    // Absolute fallback: never leave the user stuck on "Loading…"
    const id = "c"+Date.now();
    charIndex = [{id, name:"New Adventurer"}];
    state = defaultChar(id);
    persistent = false;
  }
  render();
})();
</script>
</body>
</html>
