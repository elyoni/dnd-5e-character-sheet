name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node build.js

      - name: Prepare site
        run: |
          mkdir site
          cp dnd_character_sheet.html site/index.html
          cp dnd_character_sheet.html site/dnd_character_sheet.html
          cp field-guide.html site/field-guide.html
          mkdir -p site/content/images
          cp -r content/images/. site/content/images/
          DEPLOY_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          COMMIT_SHA="$(git rev-parse --short HEAD)"
          for f in site/index.html site/dnd_character_sheet.html; do
            sed -i "s/__DEPLOY_TIME__/${DEPLOY_TIME}/" "$f"
            sed -i "s/__COMMIT_SHA__/${COMMIT_SHA}/" "$f"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
