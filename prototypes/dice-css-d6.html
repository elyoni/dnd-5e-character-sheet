<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSS 3D Dice Prototype (d6)</title>
<style>
  * {
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    overflow: hidden;
    background: radial-gradient(ellipse at center, #3a3a45 0%, #202027 100%);
    font-family: system-ui, sans-serif;
  }

  .arena {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .die-size {
    --size: 90px;
  }

  .shadow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(var(--size) * 1.3);
    height: calc(var(--size) * 0.5);
    margin-left: calc(var(--size) * -0.65);
    margin-top: calc(var(--size) * -0.25);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);
    transform: translate(0, 0) scale(1);
    pointer-events: none;
  }

  /* Carries the on-screen translate (where the die lands) and owns its own
     perspective, so the vanishing point always stays centered on the die
     itself instead of on the screen — otherwise a die landing away from
     center gets skewed toward a fixed vanishing point and looks tilted. */
  .dice-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--size);
    height: var(--size);
    margin-left: calc(var(--size) / -2);
    margin-top: calc(var(--size) / -2);
    perspective: 700px;
  }

  .dice {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: calc(var(--size) * 0.2);
    border: calc(var(--size) * 0.05) solid #f6f3f0;
    transform-style: preserve-3d;
    background: linear-gradient(145deg, #dddbd8, #fff);
  }

  .face::before {
    position: absolute;
    content: '';
    width: 100%;
    height: 100%;
    border-radius: calc(var(--size) * 0.2);
    background: #f6f3f0;
    transform: translateZ(-1px);
  }

  .pip {
    position: absolute;
    width: 18%;
    height: 18%;
    border-radius: 50%;
    background: #131210;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
  }

  /* 3x3 pip grid positions, expressed as percentages of the face */
  .p-tl { top: 18%; left: 18%; }
  .p-tr { top: 18%; left: 82%; transform: translateX(-100%); }
  .p-ml { top: 50%; left: 18%; transform: translateY(-50%); }
  .p-mr { top: 50%; left: 82%; transform: translate(-100%, -50%); }
  .p-mc { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .p-bl { top: 82%; left: 18%; transform: translateY(-100%); }
  .p-br { top: 82%; left: 82%; transform: translate(-100%, -100%); }

  .front { transform: translateZ(calc(var(--size) / 2)); }
  .back  { transform: rotateX(180deg) translateZ(calc(var(--size) / 2)); }
  .top   { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); }
  .bottom{ transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }
  .right { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); }
  .left  { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }

  .hud {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .roll {
    cursor: pointer;
    color: #eeeeee;
    padding: 10px 20px;
    border-radius: 6px;
    font: 700 16px system-ui, sans-serif;
    border: 2px solid #eeeeee;
    background: rgba(0, 0, 0, .2);
    transition: .2s;
  }

  .roll:hover {
    color: #2b2b33;
    background: #eeeeee;
  }

  .roll:disabled {
    opacity: .5;
    cursor: default;
    background: rgba(0, 0, 0, .2);
    color: #eeeeee;
  }

  .result {
    color: #eeeeee;
    font: 700 20px system-ui, sans-serif;
    min-height: 1.4em;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
</style>
</head>
<body>

  <div class="arena" id="arena">
    <div class="shadow die-size" id="shadow"></div>
    <div class="dice-wrap die-size" id="dice-wrap">
      <div class="dice" id="dice">
        <div class="face front" data-value="1"></div>
        <div class="face back" data-value="6"></div>
        <div class="face top" data-value="2"></div>
        <div class="face bottom" data-value="5"></div>
        <div class="face right" data-value="3"></div>
        <div class="face left" data-value="4"></div>
      </div>
    </div>
  </div>

  <div class="hud">
    <div class="result" id="result">&nbsp;</div>
    <button class="roll" id="roll-btn">Roll Dice</button>
  </div>

<script>
  // Standard d6 pip layouts, keyed by face value.
  const PIP_LAYOUTS = {
    1: ["p-mc"],
    2: ["p-tl", "p-br"],
    3: ["p-tl", "p-mc", "p-br"],
    4: ["p-tl", "p-tr", "p-bl", "p-br"],
    5: ["p-tl", "p-tr", "p-mc", "p-bl", "p-br"],
    6: ["p-tl", "p-tr", "p-ml", "p-mr", "p-bl", "p-br"],
  };

  // Each face's resting rotation, i.e. what rotateX/rotateY value brings
  // that face's data-value to the front (facing the camera).
  const FACE_ROTATIONS = {
    1: { x: 0, y: 0 },     // front
    6: { x: 180, y: 0 },   // back
    2: { x: -90, y: 0 },   // top (its local transform is rotateX(90), so
                            //      viewing it means countering with -90)
    5: { x: 90, y: 0 },    // bottom
    3: { x: 0, y: -90 },   // right
    4: { x: 0, y: 90 },    // left
  };

  const arena = document.getElementById("arena");
  const diceWrap = document.getElementById("dice-wrap");
  const dice = document.getElementById("dice");
  const shadow = document.getElementById("shadow");
  const rollBtn = document.getElementById("roll-btn");
  const resultEl = document.getElementById("result");

  let wrapAnim = null;
  let diceAnim = null;
  let shadowAnim = null;

  function paintPips() {
    dice.querySelectorAll(".face").forEach((face) => {
      const value = Number(face.dataset.value);
      face.querySelectorAll(".pip").forEach((p) => p.remove());
      for (const pos of PIP_LAYOUTS[value]) {
        const pip = document.createElement("div");
        pip.className = `pip ${pos}`;
        face.appendChild(pip);
      }
    });
  }

  // Builds a toss trajectory landing at (landX, landY) — offsets in px from
  // the arena center — with a gravity-like arc and a small settling bounce,
  // spinning through (rotX, rotY) degrees total along the way. The wrap
  // (translate/lift) and the die (rotation only) are animated separately so
  // the die's own perspective travels with it and it never looks skewed.
  function buildTrajectory(landX, landY, rotX, rotY) {
    const liftHeight = 160 + Math.random() * 80;
    const bounceHeight = liftHeight * 0.18;
    const flightEnd = 0.68; // fraction of the timeline spent in the air
    const spinEnd = 0.8;    // fraction of the timeline spent still spinning

    const wrapFrames = [];
    const diceFrames = [];
    const shadowFrames = [];

    const flightPoints = [0, 0.22, 0.45, flightEnd];
    for (const t of flightPoints) {
      const ft = t / flightEnd; // 0..1 progress through the arc
      const x = landX * ft;
      const y = landY * ft;
      const lift = liftHeight * 4 * ft * (1 - ft);
      const spinT = Math.min(t / spinEnd, 1);
      const rx = rotX * spinT;
      const ry = rotY * spinT;

      wrapFrames.push({ offset: t, transform: `translate(${x}px, ${y - lift}px)` });
      diceFrames.push({ offset: t, transform: `rotateX(${rx}deg) rotateY(${ry}deg)` });
      shadowFrames.push({
        offset: t,
        transform: `translate(${x}px, ${y}px) scale(${1 - 0.55 * (lift / liftHeight)})`,
        opacity: 1 - 0.6 * (lift / liftHeight),
      });
    }

    // small settling bounce after landing
    const bouncePoints = [
      { t: 0.82, lift: bounceHeight },
      { t: 0.92, lift: 0 },
      { t: 1.0, lift: 0 },
    ];
    for (const { t, lift } of bouncePoints) {
      const spinT = Math.min(t / spinEnd, 1);
      const rx = rotX * spinT;
      const ry = rotY * spinT;
      wrapFrames.push({ offset: t, transform: `translate(${landX}px, ${landY - lift}px)` });
      diceFrames.push({ offset: t, transform: `rotateX(${rx}deg) rotateY(${ry}deg)` });
      shadowFrames.push({
        offset: t,
        transform: `translate(${landX}px, ${landY}px) scale(${1 - 0.55 * (lift / liftHeight)})`,
        opacity: 1 - 0.6 * (lift / liftHeight),
      });
    }

    return { wrapFrames, diceFrames, shadowFrames };
  }

  function pickLandingSpot() {
    const rect = arena.getBoundingClientRect();
    const margin = 90; // keep the die fully on screen, clear of the HUD
    const maxX = rect.width / 2 - margin;
    const maxY = rect.height / 2 - margin - 40;
    const x = (Math.random() * 2 - 1) * maxX;
    const y = (Math.random() * 2 - 1) * maxY * 0.7 - 20; // bias upward, away from the HUD
    return { x, y };
  }

  function rollDice() {
    if (wrapAnim) wrapAnim.cancel();
    if (diceAnim) diceAnim.cancel();
    if (shadowAnim) shadowAnim.cancel();

    rollBtn.disabled = true;
    resultEl.textContent = " ";

    const value = 1 + Math.floor(Math.random() * 6);
    const { x: faceX, y: faceY } = FACE_ROTATIONS[value];
    const spinX = 360 * (2 + Math.floor(Math.random() * 2));
    const spinY = 360 * (2 + Math.floor(Math.random() * 2));
    const rotX = faceX + spinX * (Math.random() < 0.5 ? 1 : -1);
    const rotY = faceY + spinY * (Math.random() < 0.5 ? 1 : -1);

    const { x: landX, y: landY } = pickLandingSpot();
    const { wrapFrames, diceFrames, shadowFrames } = buildTrajectory(landX, landY, rotX, rotY);

    const duration = 1300;
    wrapAnim = diceWrap.animate(wrapFrames, { duration, easing: "linear", fill: "forwards" });
    diceAnim = dice.animate(diceFrames, { duration, easing: "linear", fill: "forwards" });
    shadowAnim = shadow.animate(shadowFrames, { duration, easing: "linear", fill: "forwards" });

    diceAnim.onfinish = () => {
      resultEl.textContent = `Result: ${value}`;
      rollBtn.disabled = false;
    };
  }

  paintPips();
  rollBtn.addEventListener("click", rollDice);
</script>

</body>
</html>
