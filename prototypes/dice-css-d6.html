<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSS 3D Dice Prototype (d6 + d8)</title>
<style>
  * {
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    overflow: hidden;
    background: radial-gradient(ellipse at center, #3a3a45 0%, #202027 100%);
    font-family: system-ui, sans-serif;
  }

  .arena {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .shadow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(var(--size) * 1.3);
    height: calc(var(--size) * 0.5);
    margin-left: calc(var(--size) * -0.65);
    margin-top: calc(var(--size) * -0.25);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);
    transform: translate(0, 0) scale(1);
    pointer-events: none;
  }

  /* Carries the on-screen translate (where the die lands) and owns its own
     perspective, so the vanishing point always stays centered on the die
     itself instead of on the screen — otherwise a die landing away from
     center gets skewed toward a fixed vanishing point and looks tilted. */
  .dice-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--size);
    height: var(--size);
    margin-left: calc(var(--size) / -2);
    margin-top: calc(var(--size) / -2);
    perspective: 700px;
  }

  .dice {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }

  /* ---------- d6 (cube) faces ---------- */

  .d6-face {
    position: absolute;
    width: var(--d6-size);
    height: var(--d6-size);
    top: 50%;
    left: 50%;
    margin-left: calc(var(--d6-size) / -2);
    margin-top: calc(var(--d6-size) / -2);
    border-radius: calc(var(--d6-size) * 0.2);
    border: calc(var(--d6-size) * 0.05) solid #f6f3f0;
    transform-style: preserve-3d;
    background: linear-gradient(145deg, #dddbd8, #fff);
  }

  .d6-face::before {
    position: absolute;
    content: '';
    width: 100%;
    height: 100%;
    border-radius: calc(var(--d6-size) * 0.2);
    background: #f6f3f0;
    transform: translateZ(-1px);
  }

  .pip {
    position: absolute;
    width: 18%;
    height: 18%;
    border-radius: 50%;
    background: #131210;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
  }

  /* 3x3 pip grid positions, expressed as percentages of the face */
  .p-tl { top: 18%; left: 18%; }
  .p-tr { top: 18%; left: 82%; transform: translateX(-100%); }
  .p-ml { top: 50%; left: 18%; transform: translateY(-50%); }
  .p-mr { top: 50%; left: 82%; transform: translate(-100%, -50%); }
  .p-mc { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .p-bl { top: 82%; left: 18%; transform: translateY(-100%); }
  .p-br { top: 82%; left: 82%; transform: translate(-100%, -100%); }

  .d6-front { transform: translateZ(calc(var(--d6-size) / 2)); }
  .d6-back  { transform: rotateX(180deg) translateZ(calc(var(--d6-size) / 2)); }
  .d6-top   { transform: rotateX(90deg) translateZ(calc(var(--d6-size) / 2)); }
  .d6-bottom{ transform: rotateX(-90deg) translateZ(calc(var(--d6-size) / 2)); }
  .d6-right { transform: rotateY(90deg) translateZ(calc(var(--d6-size) / 2)); }
  .d6-left  { transform: rotateY(-90deg) translateZ(calc(var(--d6-size) / 2)); }

  /* ---------- d8 (octahedron) faces ---------- */
  /* Built as two 4-sided pyramids glued base-to-base at a shared square
     equator. Each face is an equilateral triangle, positioned/tilted via
     inline styles computed in JS (the geometry needs real numbers, not
     values that are practical to hand-write in CSS). */

  .d8-face {
    position: absolute;
    display: flex;
    background: linear-gradient(145deg, #dddbd8, #fff);
    filter: drop-shadow(0 0 1px rgba(0,0,0,.4));
  }

  .d8-face .num {
    position: absolute;
    left: 50%;
    font: 700 15px system-ui, sans-serif;
    color: #131210;
    transform: translate(-50%, -50%);
  }

  .hud {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .roll {
    cursor: pointer;
    color: #eeeeee;
    padding: 10px 20px;
    border-radius: 6px;
    font: 700 16px system-ui, sans-serif;
    border: 2px solid #eeeeee;
    background: rgba(0, 0, 0, .2);
    transition: .2s;
  }

  .roll:hover {
    color: #2b2b33;
    background: #eeeeee;
  }

  .roll:disabled {
    opacity: .5;
    cursor: default;
    background: rgba(0, 0, 0, .2);
    color: #eeeeee;
  }

  .result {
    color: #eeeeee;
    font: 700 20px system-ui, sans-serif;
    min-height: 1.4em;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
</style>
</head>
<body>

  <div class="arena" id="arena"></div>

  <div class="hud">
    <div class="result" id="result">&nbsp;</div>
    <button class="roll" id="roll-btn">Roll Dice</button>
  </div>

<script>
  const arena = document.getElementById("arena");
  const rollBtn = document.getElementById("roll-btn");
  const resultEl = document.getElementById("result");

  // ---------- d6 ----------

  const D6_PIP_LAYOUTS = {
    1: ["p-mc"],
    2: ["p-tl", "p-br"],
    3: ["p-tl", "p-mc", "p-br"],
    4: ["p-tl", "p-tr", "p-bl", "p-br"],
    5: ["p-tl", "p-tr", "p-mc", "p-bl", "p-br"],
    6: ["p-tl", "p-tr", "p-ml", "p-mr", "p-bl", "p-br"],
  };

  // Each face's resting rotation, i.e. what rotateX/rotateY value brings
  // that face's value to the front (facing the camera).
  const D6_FACE_ROTATIONS = {
    1: { x: 0, y: 0 },     // front
    6: { x: 180, y: 0 },   // back
    2: { x: -90, y: 0 },   // top (its local transform is rotateX(90), so
                            //      viewing it means countering with -90)
    5: { x: 90, y: 0 },    // bottom
    3: { x: 0, y: -90 },   // right
    4: { x: 0, y: 90 },    // left
  };

  function buildD6(size) {
    const dice = document.createElement("div");
    dice.className = "dice";
    dice.style.setProperty("--d6-size", size + "px");

    const faces = [
      ["d6-front", 1], ["d6-back", 6], ["d6-top", 2],
      ["d6-bottom", 5], ["d6-right", 3], ["d6-left", 4],
    ];
    for (const [cls, value] of faces) {
      const face = document.createElement("div");
      face.className = `d6-face ${cls}`;
      for (const pos of D6_PIP_LAYOUTS[value]) {
        const pip = document.createElement("div");
        pip.className = `pip ${pos}`;
        face.appendChild(pip);
      }
      dice.appendChild(face);
    }
    return dice;
  }

  // ---------- d8 (octahedron) ----------

  // Regular-octahedron geometry: base edge W, equilateral-triangle face
  // height H = W*sqrt(3)/2, base radius (center to base-edge midpoint)
  // r = W/2. The tilt angle that folds a flat vertical face up into the
  // pyramid (about its base edge) satisfies sin(tilt) = r/H, which for an
  // equilateral triangle always works out to ~35.264deg regardless of W.
  const OCT_TILT_DEG = (Math.asin(0.5 / (Math.sqrt(3) / 2)) * 180) / Math.PI;

  function buildD8(edge) {
    const H = edge * (Math.sqrt(3) / 2);
    const r = edge / 2;

    const dice = document.createElement("div");
    dice.className = "dice";

    // top pyramid: apex up, values 1-4; bottom pyramid: apex down, values 5-8
    const tiers = [
      { apex: "up", values: [1, 2, 3, 4] },
      { apex: "down", values: [5, 6, 7, 8] },
    ];

    for (const tier of tiers) {
      for (let i = 0; i < 4; i++) {
        const value = tier.values[i];
        const face = document.createElement("div");
        face.className = "d8-face";
        face.style.width = edge + "px";
        face.style.height = H + "px";
        face.style.left = "50%";
        face.style.top = "50%";
        face.style.marginLeft = -edge / 2 + "px";

        const num = document.createElement("span");
        num.className = "num";
        num.textContent = String(value);

        if (tier.apex === "up") {
          face.style.marginTop = -H + "px";
          face.style.transformOrigin = "50% 100%";
          face.style.clipPath = "polygon(50% 0%, 100% 100%, 0% 100%)";
          // Positive rotateX folds this face's far (apex) edge in toward
          // the vertical axis so all 4 top faces converge on one point
          // above the equator; the opposite sign pushes them apart instead.
          face.style.transform =
            `rotateY(${i * 90}deg) translateZ(${r}px) rotateX(${OCT_TILT_DEG}deg)`;
          num.style.top = "66.7%"; // centroid of an apex-top triangle
        } else {
          face.style.marginTop = "0px";
          face.style.transformOrigin = "50% 0%";
          face.style.clipPath = "polygon(50% 100%, 0% 0%, 100% 0%)";
          face.style.transform =
            `rotateY(${i * 90}deg) translateZ(${r}px) rotateX(${-OCT_TILT_DEG}deg)`;
          num.style.top = "33.3%"; // centroid of an apex-down triangle
        }

        face.appendChild(num);
        dice.appendChild(face);
      }
    }

    return dice;
  }

  // A face's resting rotation is derived from its outward normal's
  // azimuth (around Y, matching its rotateY(i*90)) and elevation (+/-
  // OCT_TILT_DEG, matching the fold direction). Rotating the whole die by
  // rotateX(-elevation) rotateY(-azimuth) brings that normal to point
  // straight at the camera (see d6's front/back for the same idea, just
  // computed instead of hand-picked since d8's faces aren't axis-aligned).
  function buildD8FaceRotations() {
    const rotations = {};
    const tiers = [
      { values: [1, 2, 3, 4], elevation: OCT_TILT_DEG },
      { values: [5, 6, 7, 8], elevation: -OCT_TILT_DEG },
    ];
    for (const tier of tiers) {
      tier.values.forEach((value, i) => {
        const azimuth = i * 90;
        rotations[value] = { x: -tier.elevation, y: -azimuth };
      });
    }
    return rotations;
  }

  const D8_FACE_ROTATIONS = buildD8FaceRotations();

  // ---------- shared toss/roll machinery ----------

  const DICE_DEFS = [
    { size: 90, faceSize: 90, build: (s) => buildD6(s), faceRotations: D6_FACE_ROTATIONS, idleX: -80 },
    { size: 150, faceSize: 92, build: (s) => buildD8(s), faceRotations: D8_FACE_ROTATIONS, idleX: 80 },
  ];

  const instances = DICE_DEFS.map((def) => {
    const wrap = document.createElement("div");
    wrap.className = "dice-wrap";
    wrap.style.setProperty("--size", def.size + "px");
    wrap.style.transform = `translate(${def.idleX}px, 0px)`;

    const shadow = document.createElement("div");
    shadow.className = "shadow";
    shadow.style.setProperty("--size", def.size + "px");
    shadow.style.transform = `translate(${def.idleX}px, 0px)`;

    const diceEl = def.build(def.faceSize);
    wrap.appendChild(diceEl);

    arena.appendChild(shadow);
    arena.appendChild(wrap);

    return { def, wrap, diceEl, shadow, wrapAnim: null, diceAnim: null, shadowAnim: null };
  });

  // Builds a toss trajectory landing at (landX, landY) — offsets in px from
  // the arena center — with a gravity-like arc and a small settling bounce,
  // spinning through (rotX, rotY) degrees total along the way. The wrap
  // (translate/lift) and the die (rotation only) are animated separately so
  // the die's own perspective travels with it and it never looks skewed.
  function buildTrajectory(landX, landY, rotX, rotY) {
    const liftHeight = 160 + Math.random() * 80;
    const bounceHeight = liftHeight * 0.18;
    const flightEnd = 0.68; // fraction of the timeline spent in the air
    const spinEnd = 0.8;    // fraction of the timeline spent still spinning

    const wrapFrames = [];
    const diceFrames = [];
    const shadowFrames = [];

    const flightPoints = [0, 0.22, 0.45, flightEnd];
    for (const t of flightPoints) {
      const ft = t / flightEnd; // 0..1 progress through the arc
      const x = landX * ft;
      const y = landY * ft;
      const lift = liftHeight * 4 * ft * (1 - ft);
      const spinT = Math.min(t / spinEnd, 1);
      const rx = rotX * spinT;
      const ry = rotY * spinT;

      wrapFrames.push({ offset: t, transform: `translate(${x}px, ${y - lift}px)` });
      diceFrames.push({ offset: t, transform: `rotateX(${rx}deg) rotateY(${ry}deg)` });
      shadowFrames.push({
        offset: t,
        transform: `translate(${x}px, ${y}px) scale(${1 - 0.55 * (lift / liftHeight)})`,
        opacity: 1 - 0.6 * (lift / liftHeight),
      });
    }

    // small settling bounce after landing
    const bouncePoints = [
      { t: 0.82, lift: bounceHeight },
      { t: 0.92, lift: 0 },
      { t: 1.0, lift: 0 },
    ];
    for (const { t, lift } of bouncePoints) {
      const spinT = Math.min(t / spinEnd, 1);
      const rx = rotX * spinT;
      const ry = rotY * spinT;
      wrapFrames.push({ offset: t, transform: `translate(${landX}px, ${landY - lift}px)` });
      diceFrames.push({ offset: t, transform: `rotateX(${rx}deg) rotateY(${ry}deg)` });
      shadowFrames.push({
        offset: t,
        transform: `translate(${landX}px, ${landY}px) scale(${1 - 0.55 * (lift / liftHeight)})`,
        opacity: 1 - 0.6 * (lift / liftHeight),
      });
    }

    return { wrapFrames, diceFrames, shadowFrames };
  }

  function pickLandingSpots(count) {
    const rect = arena.getBoundingClientRect();
    const margin = 110; // keep every die fully on screen, clear of the HUD
    const maxX = rect.width / 2 - margin;
    const maxY = rect.height / 2 - margin - 40;
    const minSeparation = 130;

    const spots = [];
    for (let n = 0; n < count; n++) {
      let spot;
      let attempts = 0;
      do {
        const x = (Math.random() * 2 - 1) * maxX;
        const y = (Math.random() * 2 - 1) * maxY * 0.7 - 20; // bias upward, away from the HUD
        spot = { x, y };
        attempts++;
      } while (
        attempts < 8 &&
        spots.some((s) => Math.hypot(s.x - spot.x, s.y - spot.y) < minSeparation)
      );
      spots.push(spot);
    }
    return spots;
  }

  function rollDice() {
    instances.forEach((inst) => {
      if (inst.wrapAnim) inst.wrapAnim.cancel();
      if (inst.diceAnim) inst.diceAnim.cancel();
      if (inst.shadowAnim) inst.shadowAnim.cancel();
    });

    rollBtn.disabled = true;
    resultEl.textContent = " ";

    const spots = pickLandingSpots(instances.length);
    const duration = 1300;
    const values = [];
    let remaining = instances.length;

    instances.forEach((inst, idx) => {
      const faceCount = Object.keys(inst.def.faceRotations).length;
      const value = 1 + Math.floor(Math.random() * faceCount);
      values[idx] = value;

      const { x: faceX, y: faceY } = inst.def.faceRotations[value];
      const spinX = 360 * (2 + Math.floor(Math.random() * 2));
      const spinY = 360 * (2 + Math.floor(Math.random() * 2));
      const rotX = faceX + spinX * (Math.random() < 0.5 ? 1 : -1);
      const rotY = faceY + spinY * (Math.random() < 0.5 ? 1 : -1);

      const { x: landX, y: landY } = spots[idx];
      const { wrapFrames, diceFrames, shadowFrames } = buildTrajectory(landX, landY, rotX, rotY);

      inst.wrapAnim = inst.wrap.animate(wrapFrames, { duration, easing: "linear", fill: "forwards" });
      inst.diceAnim = inst.diceEl.animate(diceFrames, { duration, easing: "linear", fill: "forwards" });
      inst.shadowAnim = inst.shadow.animate(shadowFrames, { duration, easing: "linear", fill: "forwards" });

      inst.diceAnim.onfinish = () => {
        remaining--;
        if (remaining === 0) {
          resultEl.textContent = `Result: ${values.join(" + ")} = ${values.reduce((a, b) => a + b, 0)}`;
          rollBtn.disabled = false;
        }
      };
    });
  }

  rollBtn.addEventListener("click", rollDice);
</script>

</body>
</html>
